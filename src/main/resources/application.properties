spring.application.name=sverka
server.address=${SVERKA_BIND:127.0.0.1}
server.port=${SVERKA_PORT:8094}
server.servlet.session.cookie.name=SVERKA_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SVERKA_SECURE_COOKIE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
spring.datasource.url=${SVERKA_JDBC_URL:jdbc:h2:file:./data/sverka;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SVERKA_JDBC_USER:sa}
spring.datasource.password=${SVERKA_JDBC_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=13MB
spring.servlet.multipart.file-size-threshold=0
spring.thymeleaf.encoding=UTF-8
sverka.demo=${SVERKA_DEMO:false}
sverka.user=${SVERKA_USER:}
sverka.password=${SVERKA_PASSWORD:}
